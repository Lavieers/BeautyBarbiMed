<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f5" />
    <title>Beauty Barbi Med - Gabinet Medycyny Estetycznej i Kosmetologii | Lublin</title>
    <!-- Zdjęcie hero startuje od razu, ale leży pod kremową zasłoną — nie jako goły kadr. -->
    <link rel="preload" as="image" href="/src/assets/hero-bg.webp" fetchpriority="high" />
    <style>
      #lcp-hero { position: fixed; inset: 0; pointer-events: none; }
      #lcp-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: right center; }
      #lcp-hero .lcp-hero__veil {
        position: absolute; inset: 0;
        background:
          linear-gradient(90deg, rgba(251, 248, 245, 0.98) 0%, rgba(251, 248, 245, 0.94) 38%, rgba(251, 248, 245, 0.82) 48%, rgba(251, 248, 245, 0.35) 60%, rgba(251, 248, 245, 0) 72%),
          linear-gradient(180deg, rgba(251, 248, 245, 0.55) 0%, rgba(251, 248, 245, 0.15) 14%, rgba(251, 248, 245, 0) 28%);
      }
      @media (max-width: 900px) {
        #lcp-hero img { object-position: 74% center; }
        #lcp-hero .lcp-hero__veil {
          background:
            linear-gradient(180deg, rgba(251, 248, 245, 0.98) 0%, rgba(251, 248, 245, 0.92) 28%, rgba(251, 248, 245, 0.68) 55%, rgba(251, 248, 245, 0.25) 80%, rgba(39, 30, 26, 0.1) 100%),
            linear-gradient(90deg, rgba(251, 248, 245, 0.7) 0%, rgba(251, 248, 245, 0) 80%);
        }
      }
    </style>
    <!-- Czcionki startują od razu, ale nie blokują pierwszego rysowania (display=swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      />
    </noscript>
  </head>
  <body style="margin:0;background:#fbf8f5">
    <div id="lcp-hero" aria-hidden="true">
      <img id="lcp-hero-img" src="/src/assets/hero-bg.webp" alt="" fetchpriority="high" />
      <div class="lcp-hero__veil"></div>
    </div>
    <div id="root"></div>
    <script>
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          var script = document.createElement('script')
          script.type = 'module'
          script.src = '__BOOT__'
          document.body.appendChild(script)
        })
      })
    </script>
  </body>
</html>
